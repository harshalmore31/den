name: Publish den-agent to npm

on:
  push:
    tags:
      - "cli-v*"
  workflow_dispatch:

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/den-cli
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org/"

      - name: Verify tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/cli-v')
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/cli-v}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag cli-v$TAG_VERSION does not match package.json version $PKG_VERSION"
            exit 1
          fi
          echo "Tag and package version match: $PKG_VERSION"

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Pack to verify tarball shape
        run: npm pack --dry-run

      - name: Upload built package
        uses: actions/upload-artifact@v4
        with:
          name: den-cli-package
          path: packages/den-cli/

  publish:
    name: Publish to npm via Trusted Publisher
    needs: build
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write     # required for OIDC handshake with npm
    defaults:
      run:
        working-directory: packages/den-cli
    steps:
      - name: Download built package
        uses: actions/download-artifact@v4
        with:
          name: den-cli-package
          path: packages/den-cli/

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org/"

      - name: Make CLI executable (chmod from upload artifact is not preserved)
        run: chmod +x dist/cli.mjs

      - name: Publish with provenance via OIDC
        run: npm publish --provenance --access public
