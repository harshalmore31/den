name: Publish den-agent to npm

# Trusted Publisher (OIDC) flow per https://docs.npmjs.com/trusted-publishing-with-oidc.
# No NPM_TOKEN secret needed -- npm exchanges the GitHub OIDC token for a
# short-lived publish token on each run. Provenance auto-attaches because
# (a) the repo is public and (b) we're publishing via trusted publishing.
#
# Single-job structure (matches the official docs example) because the
# two-job artifact roundtrip didn't preserve node_modules/.bin reliably,
# breaking prepublishOnly's call to esbuild.

on:
  push:
    tags:
      - "cli-v*"
  workflow_dispatch:

jobs:
  publish:
    name: Publish via npm Trusted Publisher (OIDC)
    runs-on: ubuntu-latest
    permissions:
      id-token: write     # OIDC handshake with npm (mandatory)
      contents: read
    defaults:
      run:
        working-directory: packages/den-cli
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.14.0"   # explicit -- trusted publishing needs npm 11.5.1+
          registry-url: "https://registry.npmjs.org/"

      - name: Force latest npm (trusted publishing needs >= 11.5.1)
        run: |
          npm install -g npm@latest
          echo "node: $(node --version)"
          echo "npm:  $(npm --version)"

      - name: Verify tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/cli-v')
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/cli-v}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag cli-v$TAG_VERSION does not match package.json version $PKG_VERSION"
            exit 1
          fi
          echo "Tag and package version match: $PKG_VERSION"

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Pack to verify tarball shape
        run: npm pack --dry-run

      - name: Publish to npm (OIDC + auto-provenance)
        run: |
          echo "=== Publish context ==="
          echo "Repo:      $GITHUB_REPOSITORY"
          echo "Ref:       $GITHUB_REF"
          echo "Workflow:  $GITHUB_WORKFLOW"
          echo "Workflow file: ${GITHUB_WORKFLOW_REF##*/}"
          echo "Run ID:    $GITHUB_RUN_ID"
          echo "Actor:     $GITHUB_ACTOR"
          echo "npm whoami: $(npm whoami 2>&1 || echo 'not authenticated (expected for OIDC)')"
          echo "======================="
          npm publish
