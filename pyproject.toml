[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "den-core"
version = "0.1.0"
description = "Den agent runtime — runs inside containers (use @den/cli for the user-facing CLI)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Harshal More" },
]
keywords = ["ai", "agents", "sandbox", "runtime", "docker", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    # CLI
    "click>=8.1",
    "rich>=13.0",

    # Agent framework
    "pydantic-ai>=0.1",

    # Container runtime
    "docker>=7.0",

    # Schema validation
    "pydantic>=2.0",
    "pyyaml>=6.0",

    # Scheduling
    "apscheduler>=3.10,<4.0",

    # LLM providers (via pydantic-ai)
    "anthropic>=0.25",
    "openai>=1.20",

    # Memory
    "fastembed>=0.3",

    # Server
    "fastapi>=0.115",
    "uvicorn>=0.32",

    # Logging
    "structlog>=24.0",

    # HTTP
    "httpx>=0.27",

    # Tool dependencies
    # brave-search SDK has broken metadata; we use httpx direct API calls instead
    "pypdf>=4.0",
    "pandas>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.12",
    "pytest-asyncio>=0.23",
    "coverage>=7.0",
    "ruff>=0.4",
    "mypy>=1.9",
]

# No user-facing CLI scripts — the npm @den/cli is the only user interface.
# den-agent-process runs inside Docker containers only.
[project.scripts]
den-agent-process = "den.core.agent_process:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["den*"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
